# powerbot:tareas
tareas:

  monitor_sistema_Ejemplo:
    intervalo: 120
    timeout_ollama: 250
    timeout_script: 60
    max_reintentos: 3
    prompt:
      - Usa psutil.cpu_percent(interval=1) para obtener el porcentaje de uso de CPU.
      - Usa psutil.virtual_memory() para obtener RAM total y disponible en GB.
      - Muestra cada metrica en una linea con formato "Nombre; valor unidad".

  espacio_disco_Ejemplo:
    intervalo: 300
    timeout_ollama: 250
    timeout_script: 60
    max_reintentos: 3
    prompt:
      - Usa shutil.disk_usage() para obtener el espacio total, usado y libre del disco C:.
      - Muestra los tres valores en GB con dos decimales.
      - Si el espacio libre es menor del 10%, añade una linea de aviso.
